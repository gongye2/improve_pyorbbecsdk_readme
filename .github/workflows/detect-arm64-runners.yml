# =============================================================================
# detect-arm64-runners.yml - 检测可用的 ARM64 Runner
# 触发: workflow_dispatch (手动) / schedule (定时)
# 目标: 检测 GitHub 目前支持的 Linux ARM64 系统版本
# 参考: https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#standard-github-hosted-runners-for-public-repositories
# =============================================================================
name: Detect ARM64 Runners

on:
  workflow_dispatch:
  schedule:
    # 每周一凌晨 3 点运行检测
    - cron: '0 3 * * 1'

jobs:
  # ============================================================
  # Job 1: 检测 GitHub-hosted ARM64 runners
  # ============================================================
  detect-github-hosted-arm64:
    name: "Detect GitHub-hosted ARM64"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-24.04-arm-large  # 4-vCPU, 16 GB RAM
    steps:
      - name: OS Info
        run: |
          echo "===== Runner: ${{ matrix.runner }} ====="
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Kernel: $(uname -r)"
          echo ""
          echo "===== Distribution Info ====="
          cat /etc/os-release || true
          echo ""
          echo "===== CPU Info ====="
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1 || true
          echo ""
          echo "===== Memory Info ====="
          free -h
          echo ""
          echo "===== Disk Info ====="
          df -h /

  # ============================================================
  # Job 2: 检测 self-hosted ARM64 runners (如果存在)
  # ============================================================
  detect-selfhosted-arm64:
    name: "Detect Self-hosted ARM64"
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, arm64]
          - [self-hosted, linux, arm64, ubuntu-22.04-arm]
    steps:
      - name: OS Info
        run: |
          echo "===== Self-hosted Runner: ${{ matrix.runner }} ====="
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Kernel: $(uname -r)"
          cat /etc/os-release || true

  # ============================================================
  # Job 3: 汇总报告
  # ============================================================
  summary:
    name: "Summary Report"
    runs-on: ubuntu-latest
    needs: [detect-github-hosted-arm64, detect-selfhosted-arm64]
    if: always()
    steps:
      - name: Generate Report
        run: |
          echo "## ARM64 Runner Availability Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub-hosted ARM64 Runners" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-22.04-arm | ${{ needs.detect-github-hosted-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-24.04-arm | ${{ needs.detect-github-hosted-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ubuntu-24.04-arm-large | ${{ needs.detect-github-hosted-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Self-hosted ARM64 Runners" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| self-hosted (linux, arm64) | ${{ needs.detect-selfhosted-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 参考文档: https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories" >> $GITHUB_STEP_SUMMARY
