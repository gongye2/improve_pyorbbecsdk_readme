name: Hello Runner

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [feature/add_runner]
    paths:
      - '.github/workflows/hello-runner.yml'

jobs:
  hello:
    runs-on: [self-hosted, windows, python-sdk]
    steps:
      - name: Hello
        run: echo "Runner is working!"

      - name: Python
        run: python --version

      - name: System Info
        run: |
          hostname
          whoami
