name: Nightly Regression (Python)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows_x64
          - linux_x86_64
          - linux_arm64

jobs:
  discover-hw-runners:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      has_matrix: ${{ steps.export.outputs.has_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate nightly matrix from global runner pools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/hw_discovery
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          if [ "$PLATFORM" = "all" ]; then
            python scripts/runner/generate_hw_full_test_matrix.py \
              --runner-pools scripts/runner/runner_pools.json \
              --required-capabilities depth,color \
              --all-platforms \
              --output-matrix reports/hw_discovery/hw_matrix.json
          else
            python scripts/runner/generate_hw_full_test_matrix.py \
              --runner-pools scripts/runner/runner_pools.json \
              --platform "$PLATFORM" \
              --required-capabilities depth,color \
              --output-matrix reports/hw_discovery/hw_matrix.json
          fi

      - name: Export matrix output
        id: export
        shell: bash
        run: |
          set -euo pipefail
          MATRIX_JSON=$(python -c "
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/hw_discovery/hw_matrix.json').read_text(encoding='utf-8'))
          print(json.dumps(payload, separators=(',', ':')))
          ")
          MATRIX_COUNT=$(python -c "
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/hw_discovery/hw_matrix.json').read_text(encoding='utf-8'))
          print(len(payload))
          ")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX_COUNT" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize discovery
        shell: bash
        run: |
          python -c "
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path('reports/hw_discovery/hw_matrix.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Nightly Runner Discovery\n')
              summary.write(f'- Matrix jobs: {len(matrix)}\n')
              for item in matrix:
                  summary.write(f'- {item[\"pool_name\"]} -> {item[\"platform\"]}\n')
          "

  py-nightly-regression:
    needs: discover-hw-runners
    if: ${{ needs.discover-hw-runners.outputs.has_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-hw-runners.outputs.matrix) }}
    name: ${{ matrix.display_name }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python + venv setup
      # -----------------------------------------------------------------------
      - name: Set up Python 3.10 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv python find 3.10
          if ($LASTEXITCODE -ne 0) { uv python install 3.10 }
          uv venv .venv --python 3.10
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.venv/Scripts"

      - name: Set up Python 3.10 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv python find 3.10 || uv python install 3.10
          uv venv .venv --python 3.10
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # -----------------------------------------------------------------------
      # 3. Install test dependencies
      # -----------------------------------------------------------------------
      - name: Install test dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r test/requirements_test.txt

      - name: Install test dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r test/requirements_test.txt

      # -----------------------------------------------------------------------
      # 4. Build wheel
      # -----------------------------------------------------------------------
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & scripts/build_whl/build-whl-uv.ps1 3.10 --yes --no-clean

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/build_whl/build-whl-uv.sh
          bash scripts/build_whl/build-whl-uv.sh 3.10 --yes --no-clean

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/build_whl/build-whl-uv-macos.sh
          bash scripts/build_whl/build-whl-uv-macos.sh 3.10 --yes --no-clean

      # -----------------------------------------------------------------------
      # 5. Install wheel
      # -----------------------------------------------------------------------
      - name: Install wheel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $WHL = (Get-ChildItem "wheel/*cp310*win*.whl" | Select-Object -First 1).FullName
          if (-not $WHL) { Write-Error "No wheel found"; exit 1 }
          Write-Host "Installing: $WHL"
          uv pip install $WHL

      - name: Install wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          WHL_FILE=$(ls wheel/*cp310*manylinux*.whl 2>/dev/null | head -n1 || ls wheel/*cp310*linux*.whl 2>/dev/null | head -n1)
          if [ -z "$WHL_FILE" ]; then echo "No wheel found"; ls -la wheel/; exit 1; fi
          echo "Installing: $WHL_FILE"
          uv pip install "$WHL_FILE"

      - name: Install wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          WHL_FILE=$(ls wheel/*cp310*macosx*.whl 2>/dev/null | head -n1)
          if [ -z "$WHL_FILE" ]; then echo "No wheel found"; ls -la wheel/; exit 1; fi
          echo "Installing: $WHL_FILE"
          uv pip install "$WHL_FILE"

      # -----------------------------------------------------------------------
      # 6. Run no-hardware regression
      # -----------------------------------------------------------------------
      - name: Run no-hardware regression (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports/nightly | Out-Null
          python -m pytest test/nohw/ -v --tb=short `
            --junitxml=reports/nightly/nohw_junit.xml `
            2>&1 | Tee-Object -FilePath reports/nightly/nohw.log

      - name: Run no-hardware regression (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/nightly
          python -m pytest test/nohw/ -v --tb=short \
            --junitxml=reports/nightly/nohw_junit.xml \
            2>&1 | tee reports/nightly/nohw.log

      # -----------------------------------------------------------------------
      # 7. Publish report & upload artifacts
      # -----------------------------------------------------------------------
      - name: Publish nightly nohw report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/nightly/nohw_junit.xml
          check_name: Nightly NoHW Report (Python)
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Summarize nightly failed cases (Linux/macOS)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          python3 -c "
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path('reports/nightly/nohw_junit.xml')
          log_path = Path('reports/nightly/nohw.log')
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])

          with summary_path.open('a', encoding='utf-8') as summary:
              summary.write('## Nightly NoHW Failures\n')
              if not xml_path.exists():
                  summary.write(f'- No JUnit report generated. Check {log_path.as_posix()}\n')
              else:
                  failures = []
                  for testcase in ET.parse(xml_path).getroot().iter('testcase'):
                      if testcase.find('failure') is not None or testcase.find('error') is not None:
                          suite = testcase.get('classname') or 'unknown'
                          name = testcase.get('name') or 'unknown'
                          failures.append(f'{suite}.{name}')
                  if failures:
                      for item in failures:
                          summary.write(f'- {item} -> {log_path.as_posix()}\n')
                  else:
                      summary.write('- No failed test cases.\n')
          "

      - name: Summarize nightly failed cases (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          python -c "
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path('reports/nightly/nohw_junit.xml')
          log_path = Path('reports/nightly/nohw.log')
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])

          with summary_path.open('a', encoding='utf-8') as summary:
              summary.write('## Nightly NoHW Failures\n')
              if not xml_path.exists():
                  summary.write(f'- No JUnit report generated. Check {log_path.as_posix()}\n')
              else:
                  failures = []
                  for testcase in ET.parse(xml_path).getroot().iter('testcase'):
                      if testcase.find('failure') is not None or testcase.find('error') is not None:
                          suite = testcase.get('classname') or 'unknown'
                          name = testcase.get('name') or 'unknown'
                          failures.append(f'{suite}.{name}')
                  if failures:
                      for item in failures:
                          summary.write(f'- {item} -> {log_path.as_posix()}\n')
                  else:
                      summary.write('- No failed test cases.\n')
          "

      - name: Upload nightly artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-nightly-summary-${{ matrix.pool_name }}-${{ github.run_id }}
          path: |
            reports/nightly/nohw_junit.xml
            reports/nightly/nohw.log
          retention-days: 30

  no-runner-summary:
    needs: discover-hw-runners
    if: ${{ needs.discover-hw-runners.outputs.has_matrix != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Report missing runner mapping
        run: |
          echo "No eligible runner pool found for nightly in scripts/runner/runner_pools.json" >> "$GITHUB_STEP_SUMMARY"
