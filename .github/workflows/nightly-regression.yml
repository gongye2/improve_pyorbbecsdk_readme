# =============================================================================
# nightly-regression.yml - 夜间回归测试
# 触发: 每晚 UTC 18:00 / workflow_dispatch
# 目标: 完整测试套件、性能基准、长时间稳定性
# =============================================================================
name: Nightly Regression

on:
  schedule:
    - cron: "0 18 * * *"  # 每晚 UTC 18:00
  workflow_dispatch:

env:
  UV_LINK_MODE: copy
  HARDWARE_AVAILABLE: "true"

jobs:
  # ============================================================
  # Job 1: 完整硬件测试套件
  # ============================================================
  full-hardware-test:
    name: "Full Hardware Test Suite"
    runs-on: [self-hosted, linux, orbbec]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Device health check
        run: |
          python -c "
          from pyorbbecsdk import Context
          ctx = Context()
          devices = ctx.query_devices()
          count = devices.get_count()
          if count == 0:
              print('ERROR: No device connected')
              exit(1)
          dev = devices.get_device_by_index(0)
          info = dev.get_device_info()
          print(f'Device: {info.get_name()}')
          print(f'Serial: {info.get_serial_number()}')
          print(f'FW Version: {info.get_firmware_version()}')
          "

      - name: Build wheel
        run: |
          bash scripts/build_whl/build-whl-uv.sh 3.10 --clean

      - name: Install wheel and test deps
        run: |
          pip install wheel/*.whl pytest pytest-timeout --quiet

      - name: Run all hardware tests
        run: |
          pytest test/ -v -m "hardware" \
            --timeout=300 \
            --junit-xml=reports/nightly-hardware.xml \
            2>&1 | tee logs/nightly-hardware.log
        continue-on-error: true

      - name: Run G300 series tests (if applicable)
        run: |
          pytest test/ -v -m "g300_series" \
            --timeout=300 \
            --junit-xml=reports/nightly-g300.xml \
            2>&1 | tee logs/nightly-g300.log
        continue-on-error: true

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-${{ github.run_id }}
          path: |
            reports/
            logs/
          retention-days: 30

  # ============================================================
  # Job 2: 性能基准测试
  # ============================================================
  performance-benchmark:
    name: "Performance Benchmark"
    runs-on: [self-hosted, linux, orbbec]
    timeout-minutes: 60
    needs: full-hardware-test
    if: always()  # 即使功能测试失败也运行性能测试
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install wheel/*.whl pytest --quiet

      - name: Run performance tests
        run: |
          pytest test/test_g300_series_performance.py -v -m "performance" \
            --timeout=600 \
            --junit-xml=reports/performance.xml \
            2>&1 | tee logs/performance.log
        continue-on-error: true

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-${{ github.run_id }}
          path: reports/performance.xml
          retention-days: 30

  # ============================================================
  # Job 3: 报告汇总和通知
  # ============================================================
  report:
    name: "Nightly Report"
    runs-on: ubuntu-20.04
    needs: [full-hardware-test, performance-benchmark]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: nightly-*

      - name: Generate summary
        run: |
          echo "## Nightly Regression Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| full-hardware-test   | ${{ needs.full-hardware-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| performance-benchmark | ${{ needs.performance-benchmark.result }} |" >> $GITHUB_STEP_SUMMARY
