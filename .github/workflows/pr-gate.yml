# =============================================================================
# pr-gate.yml - PR 快速质量门禁
# 触发: pull_request / push to main or feature branches
# 目标: 30分钟内完成 L1+L2，不接真机
# =============================================================================
name: PR Gate

on:
  pull_request:
    branches: [main, master, develop, "release/**"]
  push:
    branches: [main, master, "feature/**", "hotfix/**"]
  workflow_dispatch:
    inputs:
      python_versions:
        description: 'Python versions to build (min/default/all)'
        required: true
        default: 'default'
        type: choice
        options:
          - min
          - default
          - all

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  # ============================================================
  # Job 0: 动态生成版本矩阵
  # ============================================================
  generate-matrix:
    name: "Generate Build Matrix"
    runs-on: ubuntu-22.04
    outputs:
      linux-versions: ${{ steps.set-matrix.outputs.linux-versions }}
      windows-versions: ${{ steps.set-matrix.outputs.windows-versions }}
      macos-versions: ${{ steps.set-matrix.outputs.macos-versions }}
    steps:
      - name: Set version matrix
        id: set-matrix
        run: |
          # 根据输入选择版本
          VERSION_MODE="${{ github.event.inputs.python_versions || 'default' }}"
          echo "Version mode: $VERSION_MODE"

          case "$VERSION_MODE" in
            min)
              LINUX_VERSIONS='["3.10"]'
              WINDOWS_VERSIONS='["3.10"]'
              MACOS_VERSIONS='["3.10"]'
              ;;
            all)
              LINUX_VERSIONS='["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]'
              WINDOWS_VERSIONS='["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]'
              MACOS_VERSIONS='["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]'
              ;;
            default|*)
              LINUX_VERSIONS='["3.9", "3.10", "3.11", "3.12"]'
              WINDOWS_VERSIONS='["3.10", "3.11", "3.12"]'
              MACOS_VERSIONS='["3.10", "3.11", "3.12"]'
              ;;
          esac

          echo "linux-versions=$LINUX_VERSIONS" >> $GITHUB_OUTPUT
          echo "windows-versions=$WINDOWS_VERSIONS" >> $GITHUB_OUTPUT
          echo "macos-versions=$MACOS_VERSIONS" >> $GITHUB_OUTPUT

          echo "Linux versions: $LINUX_VERSIONS"
          echo "Windows versions: $WINDOWS_VERSIONS"
          echo "macOS versions: $MACOS_VERSIONS"
  # ============================================================
  # Job 1: Python 代码格式检查与自动修复
  # ============================================================
  lint-python:
    name: "L1 | Python Lint"
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tools
        run: |
          pip install black isort flake8 --quiet

      - name: Check Python formatting (black)
        run: |
          black --check --target-version py38 .

      - name: Check Python formatting (isort)
        run: |
          isort --check .

      - name: Run flake8
        run: |
          flake8 src/ --max-line-length=120 --ignore=E203,W503 \
            --per-file-ignores="src/pyorbbecsdk/__init__.py:F403,F401"

  # ============================================================
  # Job 2: Linux Wheel 构建测试
  # ============================================================
  build-linux:
    name: "L1/L2 | Build Linux"
    runs-on: ubuntu-22.04
    needs: generate-matrix
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.generate-matrix.outputs.linux-versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libusb-1.0-0-dev libudev-dev

      - name: Build wheel (Linux)
        run: |
          bash scripts/build_whl/build-whl-uv.sh ${{ matrix.python-version }} --clean
        env:
          UV_LINK_MODE: copy

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python-version }}-${{ github.sha }}
          path: wheel/*.whl
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-logs-py${{ matrix.python-version }}-${{ github.sha }}
          path: logs/
          retention-days: 7

  # ============================================================
  # Job 3: Windows Wheel 构建测试
  # ============================================================
  build-windows:
    name: "L1/L2 | Build Windows"
    runs-on: windows-2022
    needs: generate-matrix
    timeout-minutes: 35
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.generate-matrix.outputs.windows-versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v2

      - name: Build wheel (Windows)
        shell: pwsh
        run: |
          .\scripts\build_whl\build-whl-uv.ps1 ${{ matrix.python-version }} -Clean -Yes
        env:
          UV_LINK_MODE: copy

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python-version }}-${{ github.sha }}
          path: wheel/*.whl
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-logs-py${{ matrix.python-version }}-${{ github.sha }}
          path: logs\
          retention-days: 7

  # ============================================================
  # Job 4: macOS Wheel 构建测试
  # ============================================================
  build-macos:
    name: "L1/L2 | Build macOS"
    runs-on: macos-latest
    needs: generate-matrix
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.generate-matrix.outputs.macos-versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          brew install cmake libusb

      - name: Build wheel (macOS)
        run: |
          bash scripts/build_whl/build-whl-uv-macos.sh ${{ matrix.python-version }} --clean
        env:
          UV_LINK_MODE: copy

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-py${{ matrix.python-version }}-${{ github.sha }}
          path: wheel/*.whl
          retention-days: 7

  # ============================================================
  # Job 5: Python 无硬件测试
  # ============================================================
  test-python-no-hw:
    name: "L2 | Python No-HW Tests"
    runs-on: ubuntu-22.04
    needs: [generate-matrix, build-linux]
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python-version }}-${{ github.sha }}
          path: wheel/

      - name: Install wheel and test deps
        run: |
          pip install wheel/*manylinux*.whl pytest pytest-timeout --quiet

      - name: Run Python no-hardware tests
        run: |
          pytest test/ -v -m "not hardware" \
            --timeout=60 \
            --junit-xml=reports/pytest-no-hw.xml \
            2>&1 | tee logs/pytest-no-hw.log
        continue-on-error: true  # 无硬件时部分测试会跳过

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-no-hw-${{ github.sha }}
          path: |
            reports/
            logs/
          retention-days: 7

  # ============================================================
  # Job 6: Import 检查
  # ============================================================
  verify-import:
    name: "L2 | Import Check"
    runs-on: ${{ matrix.os }}
    needs: [generate-matrix, build-linux, build-windows, build-macos]
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        python-version: ["3.10"]
        include:
          - os: ubuntu-22.04
            artifact: wheel-linux-py3.10
          - os: windows-2022
            artifact: wheel-windows-py3.10
          - os: macos-latest
            artifact: wheel-macos-py3.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: wheel/

      - name: Install and verify import
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            pip install wheel/*manylinux*.whl
          else
            pip install wheel/*.whl
          fi
          python -c "import pyorbbecsdk; print('Version:', pyorbbecsdk.__version__)"
          python -c "from pyorbbecsdk import Context, Pipeline, Config"

  # ============================================================
  # Gate Summary
  # ============================================================
  gate-summary:
    name: "Gate Summary"
    runs-on: ubuntu-22.04
    needs:
      - generate-matrix
      - lint-python
      - build-linux
      - build-windows
      - build-macos
      - test-python-no-hw
      - verify-import
    if: always()
    steps:
      - name: Generate summary table
        run: |
          echo "## PR Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python        | ${{ needs.lint-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-linux        | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-windows      | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-macos        | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python-no-hw  | ${{ needs.test-python-no-hw.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| verify-import      | ${{ needs.verify-import.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check gate result
        run: |
          LINT="${{ needs.lint-python.result }}"
          LINUX="${{ needs.build-linux.result }}"
          WIN="${{ needs.build-windows.result }}"
          MAC="${{ needs.build-macos.result }}"

          if [[ "$LINT" != "success" || "$LINUX" != "success" || "$WIN" != "success" || "$MAC" != "success" ]]; then
            echo "[FAIL] Critical jobs failed."
            exit 1
          fi
          echo "[PASS] PR Gate passed."
