# =============================================================================
# daily-hw-smoke.yml - 每日硬件冒烟测试
# 触发: 每日 UTC 02:00 / workflow_dispatch
# 目标: 连接真机的 Runner 上运行基础冒烟测试
# =============================================================================
name: Daily Hardware Smoke

on:
  schedule:
    - cron: "0 2 * * *"  # 每天 UTC 02:00
  workflow_dispatch:

env:
  UV_LINK_MODE: copy
  HARDWARE_AVAILABLE: "true"

jobs:
  # ============================================================
  # Job 1: 设备健康检查 + 基础冒烟
  # ============================================================
  smoke-test:
    name: "Hardware Smoke Test"
    runs-on: [self-hosted, linux, orbbec]  # 需要配置 self-hosted runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Device health check
        id: health_check
        run: |
          python -c "
          from pyorbbecsdk import Context
          ctx = Context()
          devices = ctx.query_devices()
          count = devices.get_count()
          print(f'Connected devices: {count}')
          if count == 0:
              exit(1)
          for i in range(count):
              dev = devices.get_device_by_index(i)
              info = dev.get_device_info()
              print(f'  [{i}] {info.get_name()} - S/N: {info.get_serial_number()}')
          "

      - name: Build wheel (if needed)
        run: |
          if [ ! -d "wheel" ] || [ -z "$(ls -A wheel)" ]; then
            bash scripts/build_whl/build-whl-uv.sh 3.10 --clean
          fi

      - name: Install wheel and test deps
        run: |
          pip install wheel/*.whl pytest pytest-timeout --quiet

      - name: Run basic import test
        run: |
          python test/test_basic_import.py -v

      - name: Run basic device test
        run: |
          pytest test/test_basic_device.py -v --timeout=300
        continue-on-error: true

      - name: Run basic capture test
        run: |
          pytest test/test_basic_capture.py -v --timeout=300
        continue-on-error: true

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-smoke-report-${{ github.run_id }}
          path: |
            reports/
            logs/
          retention-days: 14

  # ============================================================
  # Job 2: 报告汇总
  # ============================================================
  report:
    name: "Smoke Test Report"
    runs-on: ubuntu-22.04
    needs: smoke-test
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Daily Hardware Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| smoke-test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
