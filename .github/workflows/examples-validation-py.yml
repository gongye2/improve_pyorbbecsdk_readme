name: Examples Validation (Python)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows_x64
          - linux_x86_64
          - linux_arm64
  pull_request:
    paths:
      - examples/**
      - test/examples_tests/**
      - .github/workflows/examples-validation-py.yml

jobs:
  # -----------------------------------------------------------------------
  # 1. Discover self-hosted runners and generate CI matrix
  # -----------------------------------------------------------------------
  discover-hw-runners:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      has_matrix: ${{ steps.export.outputs.has_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate examples validation matrix from global runner pools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/hw_discovery
          PLATFORM="${{ github.event.inputs.platform || '' }}"
          if [ "$PLATFORM" = "all" ] || [ -z "$PLATFORM" ]; then
            python scripts/runner/generate_hw_full_test_matrix.py \
              --runner-pools scripts/runner/runner_pools.json \
              --required-capabilities depth,color \
              --all-platforms \
              --output-matrix reports/hw_discovery/hw_matrix.json
          else
            python scripts/runner/generate_hw_full_test_matrix.py \
              --runner-pools scripts/runner/runner_pools.json \
              --platform "$PLATFORM" \
              --required-capabilities depth,color \
              --output-matrix reports/hw_discovery/hw_matrix.json
          fi

      - name: Export matrix output
        id: export
        shell: bash
        run: |
          set -euo pipefail
          MATRIX_JSON=$(python -c "
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/hw_discovery/hw_matrix.json').read_text(encoding='utf-8'))
          print(json.dumps(payload, separators=(',', ':')))
          ")
          MATRIX_COUNT=$(python -c "
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/hw_discovery/hw_matrix.json').read_text(encoding='utf-8'))
          print(len(payload))
          ")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX_COUNT" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize discovery
        shell: bash
        run: |
          python -c "
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path('reports/hw_discovery/hw_matrix.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Examples Validation Runner Discovery\n')
              summary.write(f'- Matrix jobs: {len(matrix)}\n')
              for item in matrix:
                  summary.write(f'- {item[\"pool_name\"]} -> {item[\"platform\"]}\n')
          "

  # -----------------------------------------------------------------------
  # 2. Build wheel, run examples smoke test and upload report
  # -----------------------------------------------------------------------
  examples:
    needs: discover-hw-runners
    if: ${{ needs.discover-hw-runners.outputs.has_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-hw-runners.outputs.matrix) }}
    name: ${{ matrix.display_name }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python + venv setup
      # -----------------------------------------------------------------------
      - name: Set up Python 3.10 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv python find 3.10
          if ($LASTEXITCODE -ne 0) { uv python install 3.10 }
          uv venv .venv --python 3.10
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.venv/Scripts"

      - name: Set up Python 3.10 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv python find 3.10 || uv python install 3.10
          uv venv .venv --python 3.10
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # -----------------------------------------------------------------------
      # 3. Install test dependencies
      # -----------------------------------------------------------------------
      - name: Install test dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r test/requirements_test.txt

      - name: Install test dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r test/requirements_test.txt

      # -----------------------------------------------------------------------
      # 4. Build wheel
      # -----------------------------------------------------------------------
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & scripts\build_whl\build-whl-uv.ps1 3.10 --yes --no-clean

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/build_whl/build-whl-uv.sh
          bash scripts/build_whl/build-whl-uv.sh 3.10 --yes --no-clean

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/build_whl/build-whl-uv-macos.sh
          bash scripts/build_whl/build-whl-uv-macos.sh 3.10 --yes --no-clean

      # -----------------------------------------------------------------------
      # 5. Install wheel
      # -----------------------------------------------------------------------
      - name: Install wheel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $WHL = (Get-ChildItem "wheel/*cp310*win*.whl" | Select-Object -First 1).FullName
          if (-not $WHL) { Write-Error "No wheel found"; exit 1 }
          Write-Host "Installing: $WHL"
          uv pip install $WHL

      - name: Install wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          WHL_FILE=$(ls wheel/*cp310*manylinux*.whl 2>/dev/null | head -n1 || ls wheel/*cp310*linux*.whl 2>/dev/null | head -n1)
          if [ -z "$WHL_FILE" ]; then echo "No wheel found"; ls -la wheel/; exit 1; fi
          echo "Installing: $WHL_FILE"
          uv pip install "$WHL_FILE"

      - name: Install wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          WHL_FILE=$(ls wheel/*cp310*macosx*.whl 2>/dev/null | head -n1)
          if [ -z "$WHL_FILE" ]; then echo "No wheel found"; ls -la wheel/; exit 1; fi
          echo "Installing: $WHL_FILE"
          uv pip install "$WHL_FILE"

      # -----------------------------------------------------------------------
      # 6. Device health check
      # -----------------------------------------------------------------------
      - name: Device health check (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -c "
          from pyorbbecsdk import Context, OBLogLevel
          ctx = Context()
          ctx.set_logger_level(OBLogLevel.NONE)
          dev_list = ctx.query_devices()
          count = dev_list.get_count()
          print(f'Connected devices: {count}')
          if count > 0:
              dev = dev_list.get_device_by_index(0)
              info = dev.get_device_info()
              print(f'Device: {info.get_name()}')
              print(f'Serial: {info.get_serial_number()}')
              print(f'Firmware: {info.get_firmware_version()}')
          else:
              print('WARNING: No Orbbec device detected')
              exit(1)
          "

      - name: Device health check (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -c "
          from pyorbbecsdk import Context, OBLogLevel
          ctx = Context()
          ctx.set_logger_level(OBLogLevel.NONE)
          dev_list = ctx.query_devices()
          count = dev_list.get_count()
          print(f'Connected devices: {count}')
          if count > 0:
              dev = dev_list.get_device_by_index(0)
              info = dev.get_device_info()
              print(f'Device: {info.get_name()}')
              print(f'Serial: {info.get_serial_number()}')
              print(f'Firmware: {info.get_firmware_version()}')
          else:
              print('WARNING: No Orbbec device detected')
              exit(1)
          "

      # -----------------------------------------------------------------------
      # 7. Run all examples smoke test
      # -----------------------------------------------------------------------
      - name: Run all examples (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python examples/run_all_examples.py

      - name: Run all examples (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python examples/run_all_examples.py

      # -----------------------------------------------------------------------
      # 8. Archive and upload smoke report
      # -----------------------------------------------------------------------
      - name: Archive smoke report (Windows)
        if: runner.os == 'Windows' && always()
        shell: powershell
        run: |
          $src = "reports/examples-smoke"
          $dst = "reports/examples-smoke.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          if (Test-Path $src) {
            Compress-Archive -Path "$src/*" -DestinationPath $dst -Force
            Write-Host "Archived to $dst"
          } else {
            Write-Host "Source directory $src not found, skipping archive"
          }

      - name: Archive smoke report (Linux/macOS)
        if: runner.os != 'Windows' && always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "reports/examples-smoke" ]; then
            cd reports
            rm -f examples-smoke.zip
            zip -r examples-smoke.zip examples-smoke/
            cd ..
          fi

      - name: Upload smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-examples-smoke-${{ matrix.pool_name }}-${{ github.run_id }}
          path: reports/examples-smoke.zip
          retention-days: 30
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # 3. Merge and summarize results
  # -----------------------------------------------------------------------
  aggregate:
    needs:
      - discover-hw-runners
      - examples
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download smoke artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: py-examples-smoke-*
          path: all_smoke_results
          merge-multiple: false

      - name: Package all smoke reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/examples-smoke-aggregate
          for dir in all_smoke_results/*/; do
            job_id=$(basename "$dir")
            mkdir -p "reports/examples-smoke-aggregate/$job_id"
            if [ -f "$dir/examples-smoke.zip" ]; then
              unzip -q "$dir/examples-smoke.zip" -d "reports/examples-smoke-aggregate/$job_id" || true
            fi
          done
          cd reports
          zip -r examples-smoke-aggregate.zip examples-smoke-aggregate/
          cd ..

      - name: Upload aggregate smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-examples-smoke-aggregate-${{ github.run_id }}
          path: reports/examples-smoke-aggregate.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Summarize smoke results
        if: always()
        shell: bash
        run: |
          echo "## Examples Smoke Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms tested: $(ls all_smoke_results/ | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          for dir in all_smoke_results/*/; do
            job_id=$(basename "$dir")
            echo "- $job_id" >> "$GITHUB_STEP_SUMMARY"
          done

  # -----------------------------------------------------------------------
  # 4. Report missing runner mapping
  # -----------------------------------------------------------------------
  no-runner-summary:
    needs: discover-hw-runners
    if: ${{ needs.discover-hw-runners.outputs.has_matrix != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Report missing runner mapping
        run: |
          echo "No eligible self-hosted runner pool found for examples validation in scripts/runner/runner_pools.json" >> "$GITHUB_STEP_SUMMARY"
