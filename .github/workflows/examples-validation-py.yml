name: Examples Validation (Python)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - examples/**
      - test/examples_tests/**
      - .github/workflows/examples-validation-py.yml

jobs:
  # -----------------------------------------------------------------------
  # 1. Discover examples and generate CI matrix
  # -----------------------------------------------------------------------
  discover:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      has_matrix: ${{ steps.export.outputs.has_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate manifest and matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/examples/discovery
          python test/examples_tests/generate_examples_manifest.py \
            --workspace-root . \
            --output reports/examples/discovery/examples_manifest.json \
            --overrides test/examples_tests/config/example_overrides.json
          python test/examples_tests/generate_ci_matrix.py \
            --manifest reports/examples/discovery/examples_manifest.json \
            --runner-pools scripts/runner/runner_pools.json \
            --output-matrix reports/examples/discovery/examples_matrix.json \
            --output-unassigned reports/examples/discovery/examples_unassigned.json

      - name: Export matrix output
        id: export
        shell: bash
        run: |
          set -euo pipefail
          MATRIX_JSON=$(python -c "
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/examples/discovery/examples_matrix.json').read_text(encoding='utf-8'))
          print(json.dumps(payload, separators=(',', ':')))
          ")
          MATRIX_COUNT=$(python -c "
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/examples/discovery/examples_matrix.json').read_text(encoding='utf-8'))
          print(len(payload))
          ")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX_COUNT" -gt 0 ]; then
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize discovery
        shell: bash
        run: |
          python -c "
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('reports/examples/discovery/examples_manifest.json').read_text(encoding='utf-8'))
          matrix = json.loads(Path('reports/examples/discovery/examples_matrix.json').read_text(encoding='utf-8'))
          unassigned = json.loads(Path('reports/examples/discovery/examples_unassigned.json').read_text(encoding='utf-8'))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Examples Discovery\n')
              summary.write(f'- Cases discovered: {manifest.get(\"case_count\", 0)}\n')
              summary.write(f'- Matrix jobs: {len(matrix)}\n')
              summary.write(f'- Unassigned case-platform pairs: {len(unassigned)}\n')
              if unassigned:
                  summary.write('### Unassigned\n')
                  for item in unassigned[:20]:
                      summary.write(f'- {item[\"case_id\"]}: {\", \".join(item[\"missing_platforms\"])}\n')
          "

      - name: Upload discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: py-examples-discovery-${{ github.run_id }}
          path: reports/examples/discovery/*
          retention-days: 30

  # -----------------------------------------------------------------------
  # 2. Build wheel and run examples
  # -----------------------------------------------------------------------
  examples:
    needs: discover
    if: ${{ needs.discover.outputs.has_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.display_name }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python + venv setup
      # -----------------------------------------------------------------------
      - name: Set up Python 3.10 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv python find 3.10
          if ($LASTEXITCODE -ne 0) { uv python install 3.10 }
          uv venv .venv --python 3.10
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.venv/Scripts"

      - name: Set up Python 3.10 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv python find 3.10 || uv python install 3.10
          uv venv .venv --python 3.10
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # -----------------------------------------------------------------------
      # 3. Install test dependencies
      # -----------------------------------------------------------------------
      - name: Install test dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          uv pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r test/requirements_test.txt

      - name: Install test dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r test/requirements_test.txt

      # -----------------------------------------------------------------------
      # 4. Build wheel
      # -----------------------------------------------------------------------
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & scripts\build_whl\build-whl-uv.ps1 3.10 --yes --no-clean

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/build_whl/build-whl-uv.sh
          bash scripts/build_whl/build-whl-uv.sh 3.10 --yes --no-clean

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/build_whl/build-whl-uv-macos.sh
          bash scripts/build_whl/build-whl-uv-macos.sh 3.10 --yes --no-clean

      # -----------------------------------------------------------------------
      # 5. Install wheel
      # -----------------------------------------------------------------------
      - name: Install wheel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $WHL = (Get-ChildItem "wheel/*cp310*win*.whl" | Select-Object -First 1).FullName
          if (-not $WHL) { Write-Error "No wheel found"; exit 1 }
          Write-Host "Installing: $WHL"
          uv pip install $WHL

      - name: Install wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          WHL_FILE=$(ls wheel/*cp310*manylinux*.whl 2>/dev/null | head -n1 || ls wheel/*cp310*linux*.whl 2>/dev/null | head -n1)
          if [ -z "$WHL_FILE" ]; then echo "No wheel found"; ls -la wheel/; exit 1; fi
          echo "Installing: $WHL_FILE"
          uv pip install "$WHL_FILE"

      - name: Install wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          WHL_FILE=$(ls wheel/*cp310*macosx*.whl 2>/dev/null | head -n1)
          if [ -z "$WHL_FILE" ]; then echo "No wheel found"; ls -la wheel/; exit 1; fi
          echo "Installing: $WHL_FILE"
          uv pip install "$WHL_FILE"

      # -----------------------------------------------------------------------
      # 6. Run examples batch
      # -----------------------------------------------------------------------
      - name: Run examples batch (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "reports/examples/${{ matrix.job_id }}" | Out-Null
          python test/examples_tests/run_examples_suite.py `
            --manifest reports/examples/discovery/examples_manifest.json `
            --case-ids '${{ matrix.case_ids }}' `
            --suite-name '${{ matrix.job_id }}' `
            --pool-name '${{ matrix.pool_name }}' `
            --platform '${{ matrix.platform }}' `
            --output-dir "reports/examples/${{ matrix.job_id }}"

      - name: Run examples batch (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/examples/${{ matrix.job_id }}
          python test/examples_tests/run_examples_suite.py \
            --manifest reports/examples/discovery/examples_manifest.json \
            --case-ids '${{ matrix.case_ids }}' \
            --suite-name '${{ matrix.job_id }}' \
            --pool-name '${{ matrix.pool_name }}' \
            --platform '${{ matrix.platform }}' \
            --output-dir reports/examples/${{ matrix.job_id }}

      # -----------------------------------------------------------------------
      # 7. Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload batch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-examples-results-${{ matrix.job_id }}
          path: reports/examples/${{ matrix.job_id }}/**
          retention-days: 30

  # -----------------------------------------------------------------------
  # 3. Merge and summarize results
  # -----------------------------------------------------------------------
  aggregate:
    needs:
      - discover
      - examples
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download examples artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: py-examples-results-*
          path: all_examples_results
          merge-multiple: false

      - name: Merge reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/examples/aggregate
          python test/examples_tests/merge_example_results.py \
            --input-dir all_examples_results \
            --output-dir reports/examples/aggregate \
            --title 'Examples Aggregate Report (Python)'

      - name: Upload aggregate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-examples-aggregate-${{ github.run_id }}
          path: reports/examples/aggregate/**
          retention-days: 30

      - name: Summarize aggregate result
        if: always()
        shell: bash
        run: |
          python -c "
          import json
          from pathlib import Path

          result_path = Path('reports/examples/aggregate/results.json')
          if not result_path.exists():
              raise SystemExit(0)

          payload = json.loads(result_path.read_text(encoding='utf-8'))
          stats = payload.get('stats', {})
          with open('summary.md', 'w', encoding='utf-8') as summary:
              summary.write('## Examples Aggregate Summary\n')
              summary.write(f'- Total: {stats.get(\"total\", 0)}\n')
              summary.write(f'- Passed: {stats.get(\"passed\", 0)}\n')
              summary.write(f'- Failed: {stats.get(\"failed\", 0)}\n')
              summary.write(f'- Skipped: {stats.get(\"skipped\", 0)}\n')
          "
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
