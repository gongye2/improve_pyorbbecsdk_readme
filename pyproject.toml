[project]
name = "pyorbbecsdk2"
version = "2.0.16"
description = "pyorbbecsdk is a python wrapper for the OrbbecSDK"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "zhonghong", email = "zhonghong@orbbec.com" }
]
dependencies = [
    "av>=12.3.0; python_version < '3.13'",
    "av==13.0.0; python_version >= '3.13'",
    "numpy",
    "opencv-python",
    "pygame",
    "pynput",
]

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "pybind11==2.12.0",
    "pybind11-global==2.12.0"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "auditwheel",
    "pybind11-stubgen",
]
