[project]
name = "pyorbbecsdk2"
version = "2.0.16"
description = "pyorbbecsdk is a python wrapper for the OrbbecSDK"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "zhonghong", email = "zhonghong@orbbec.com" }
]
dependencies = [
    "av==12.3.0; python_version < '3.13'",
    "av==13.0.0; python_version >= '3.13'",
    "numpy",
    "opencv-python",
    "pygame",
    "open3d==0.18.0",
    # pynput on macOS requires pyobjc; pyobjc 11+ requires Python 3.9+
    "pynput; sys_platform != 'darwin'",
    "pynput; sys_platform == 'darwin' and python_version >= '3.9'",
    "pyobjc-core==10.3.2; sys_platform == 'darwin' and python_version < '3.9'",
    "pyobjc-framework-Quartz==10.3.2; sys_platform == 'darwin' and python_version < '3.9'",
    "pynput; sys_platform == 'darwin' and python_version < '3.9'",
]

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "pybind11==2.12.0",
    "pybind11-global==2.12.0"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "auditwheel",
    "pybind11-stubgen",
]
